<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line of Balance: Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EDF0EF; --panel:#FFFFFF; --soft:#F3F6F5; --lane:#F8FAF9;
  --ink:#15242B; --muted:#55666E; --rule:#D2DADA; --ground:#CAD2CF;
  --chassis:#34434B; --tire:#1E272C; --glass:#CFE3EE; --pipegrey:#AEB8BC;
  --exc:#2F6FB5; --pipe:#2A8A55; --back:#D4701C;
  --exc-soft:#E3EDF8; --pipe-soft:#E1F1E8; --back-soft:#FAEBDD;
  --on-trade:#FFFFFF;
  --bad:#C23B3B; --bad-soft:#FBE6E6; --good:#1E7B4C; --good-soft:#E2F2E9;
  --warn:#8F6200; --warn-soft:#FBF0D6; --info-soft:#E8EFF2;
  --flag:#F1B80C; --flag-edge:#C99700; --flag-ink:#15242B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E171B; --panel:#162228; --soft:#1C2B32; --lane:#1A272D;
    --ink:#E6EEF0; --muted:#9BAAB1; --rule:#2B3C44; --ground:#31424A;
    --chassis:#8CA0AA; --tire:#0C1316; --glass:#46606E; --pipegrey:#7E8D94;
    --exc:#5C9BE0; --pipe:#4DBE82; --back:#F09442;
    --exc-soft:#1D3550; --pipe-soft:#1B3B2B; --back-soft:#432D17;
    --on-trade:#0E171B;
    --bad:#F07373; --bad-soft:#3E2022; --good:#5BD08E; --good-soft:#173325;
    --warn:#E5B54A; --warn-soft:#3A3014; --info-soft:#1D2D35;
  }
}
:root[data-theme="dark"]{
  --paper:#0E171B; --panel:#162228; --soft:#1C2B32; --lane:#1A272D;
  --ink:#E6EEF0; --muted:#9BAAB1; --rule:#2B3C44; --ground:#31424A;
  --chassis:#8CA0AA; --tire:#0C1316; --glass:#46606E; --pipegrey:#7E8D94;
  --exc:#5C9BE0; --pipe:#4DBE82; --back:#F09442;
  --exc-soft:#1D3550; --pipe-soft:#1B3B2B; --back-soft:#432D17;
  --on-trade:#0E171B;
  --bad:#F07373; --bad-soft:#3E2022; --good:#5BD08E; --good-soft:#173325;
  --warn:#E5B54A; --warn-soft:#3A3014; --info-soft:#1D2D35;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:400 15px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
#root{height:100%}
h1,h2,h3{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;margin:0;letter-spacing:.1px}
h1{font-size:32px;line-height:1.08;font-weight:700}
h2{font-size:24px;line-height:1.15;font-weight:600;margin-bottom:6px}
h3{font-size:18px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:minmax(350px,440px) 1fr;height:100%}
.app.wide{grid-template-columns:minmax(440px,44%) 1fr}
.left{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--rule)}
.brand{padding:14px 18px 10px}
.brand-title{font:700 17px 'Barlow Semi Condensed',sans-serif}
.brand-sub{font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--rule)}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 12px 'Barlow',sans-serif;color:var(--muted)}
.tab .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:600}
.tab.on{color:var(--ink);border-bottom-color:var(--flag)}
.tab.done .dot{background:var(--good);border-color:var(--good);color:var(--panel)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab:focus-visible,.btn:focus-visible,.btn-icon:focus-visible,.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scroll{flex:1;overflow-y:auto;padding:18px}
.right{display:flex;flex-direction:column;min-height:0;padding:14px;gap:10px;overflow-y:auto}
.scene-wrap{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px 8px}
.scene{display:block;width:100%;height:auto}
.caption{font-size:13px;color:var(--muted);padding:6px 4px 0}
.lob-wrap{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:6px;margin-bottom:10px}
.lob{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.lede{color:var(--muted);margin-bottom:14px;max-width:62ch}
.btn{appearance:none;border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--flag);border-color:var(--flag-edge);color:var(--flag-ink)}
.btn-primary:hover:not(:disabled){background:#F7C62E}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row .btn-primary{flex:1}
.btn-icon{appearance:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font-size:18px;font-weight:600;line-height:1;cursor:pointer}
.btn-icon:hover:not(:disabled){background:var(--soft)}
.btn-icon:disabled{opacity:.35;cursor:not-allowed}
.btn-sm{padding:5px 9px;font-size:13px;border-radius:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{appearance:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.seg button small{font-weight:400;color:var(--muted);font-size:12px}
.seg button.on{border-width:2px;padding:7px 5px}
.card{background:var(--panel);border:1px solid var(--rule);border-top:4px solid var(--rule);border-radius:10px;padding:14px;margin-bottom:12px}
.eq-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.eq-row:last-of-type{border-bottom:0}
.eq-name{font-weight:600}
.stepper{display:flex;align-items:center;gap:8px}
.stepper-val{min-width:20px;text-align:center;font:600 18px 'Barlow Semi Condensed',sans-serif}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--rule)}
.sum dt{font-size:12px;color:var(--muted)}
.sum dd{margin:0;font:600 17px 'Barlow Semi Condensed',sans-serif}
.callout{border:1px solid var(--rule);border-left-width:4px;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--info-soft)}
.callout.ok{background:var(--good-soft);border-color:var(--good)}
.callout.bad{background:var(--bad-soft);border-color:var(--bad)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn)}
.callout b{font-weight:600}
.callout ul{margin:6px 0 0;padding-left:18px}
.callout li{margin:3px 0}
.bar{position:relative;height:30px;border-radius:15px;background:var(--soft);border:1px solid var(--rule);overflow:hidden}
.bar.ok{border:2px solid var(--good)}
.bar-fill{height:100%;border-radius:15px 0 0 15px;transition:width .08s linear}
.bar-text{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:13px;mix-blend-mode:normal;color:var(--ink);text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:5px 2px 8px}
.formula{text-align:center;font:600 20px 'Barlow Semi Condensed',sans-serif;margin:6px 0 4px}
.slider-row{display:flex;align-items:center;gap:8px}
input[type=range].slider{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;margin:0;--c:var(--exc)}
.slider::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--c);border:3px solid var(--panel);margin-top:-9px;box-shadow:0 0 0 1.5px var(--c)}
.slider::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1.5px var(--c)}
.slider:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.locked-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;margin-bottom:8px;background:var(--soft)}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.grow{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--soft)}
.progress{display:flex;gap:4px;margin:4px 0 10px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.progress i.on{background:var(--flag)}
.nudge{display:flex;gap:4px}
.crew-row{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.crew-row .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 18px;padding:12px 14px;background:var(--soft);border-radius:10px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.how{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px}
.how li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.how .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:600 14px 'Barlow Semi Condensed',sans-serif}
.how b{display:block;font-weight:600}
.how span.t{color:var(--muted);font-size:14px}
.pid-box{margin-bottom:12px}
.pid-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.pid-grid .note{resize:none;font-size:16px;letter-spacing:.04em}
.pid-out{margin-top:8px;font-size:14px}
.pid-out b{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
@media (max-width:420px){.pid-grid{grid-template-columns:1fr}}
.reading.one{grid-template-columns:1fr;max-width:300px}
.reading{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.reading figure{margin:0;border:1px solid var(--rule);border-radius:8px;padding:6px 6px 8px;background:var(--panel)}
.reading figcaption{font-size:13px;text-align:center;color:var(--muted)}
.reading svg{width:100%;height:auto;display:block}
.rules{margin:0 0 18px;padding-left:18px;color:var(--muted);font-size:14px}
.rules li{margin:2px 0}
.result{width:100%;border-collapse:collapse;margin:8px 0}
.result th,.result td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule);font-size:14px}
.result th{font-weight:500;color:var(--muted)}
.result td:last-child,.result th:last-child{text-align:right}
.lane-name{font:600 17px 'Barlow Semi Condensed',sans-serif;fill:var(--ink)}
.lane-sub{font:400 13px 'Barlow',sans-serif;fill:var(--muted)}
.tick{font:400 12.5px 'Barlow',sans-serif;fill:var(--muted)}
.ax{font:500 14px 'Barlow',sans-serif;fill:var(--muted)}
.halo{paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.lob-label{font:600 15.5px 'Barlow Semi Condensed',sans-serif}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.bar-fill{transition:none}}
.lob.mini{min-height:170px;max-height:250px}
.three{position:relative;flex:1;min-height:320px;border-radius:10px;overflow:hidden;background:#A9CFE4;border:1px solid var(--rule)}
.three canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
.three canvas:active{cursor:grabbing}
.tag3d{position:absolute;left:0;top:0;z-index:2;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-left:4px solid;border-radius:6px;padding:3px 8px;font-size:12px;line-height:1.3;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18);will-change:transform}
.tag3d b{display:block;font:600 13px 'Barlow Semi Condensed',sans-serif}
.tag3d span{color:var(--muted)}
.day3d{position:absolute;left:10px;top:10px;z-index:2;background:rgba(255,255,255,.85);color:#15242B;border-radius:8px;padding:4px 10px;font:600 18px 'Barlow Semi Condensed',sans-serif;pointer-events:none}
.hint3d{position:absolute;right:10px;bottom:8px;z-index:2;font-size:12px;color:#1E2B31;background:rgba(255,255,255,.78);padding:2px 8px;border-radius:6px;pointer-events:none}
.three-err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;z-index:3;background:var(--panel);color:var(--ink)}
.field-label{font-size:13px;color:var(--muted);margin:14px 0 6px}
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.seg.seg4 button{font-size:13px;padding:7px 4px}
.dayline{display:flex;align-items:baseline;gap:6px}
.dayn{font:700 34px 'Barlow Semi Condensed',sans-serif;line-height:1}
.thin{height:6px;border-radius:3px;background:var(--soft);border:1px solid var(--rule);overflow:hidden;margin-top:6px}
.thin i{display:block;height:100%}
.readout{text-align:center;font-size:15px;margin:6px 0 0;min-height:22px}
.simbar{flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px 12px}
.simbar-day{display:flex;align-items:center;gap:10px}
.simbar-day .dayn{font-size:26px}
.simbar-day .slider{flex:1}
.simbar-ctrl{display:grid;grid-template-columns:3fr 4fr;gap:12px}
.simbar .field-label{margin:8px 0 5px}
.simbar .seg{margin-bottom:0}
.crew-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.right .caption{margin:0}
.g-minor{stroke:var(--rule);stroke-width:.5;opacity:.75}
.g-major{stroke:var(--rule);stroke-width:1.1}
.lob-inner{position:relative}
.sched h2{margin-bottom:2px}
.snap{position:absolute;transform:translate(-50%,calc(-100% - 16px));background:var(--panel);border:1px solid var(--rule);border-top:3px solid;border-radius:8px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.18);font-size:13px;white-space:nowrap;z-index:3}
.snap::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--panel);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:translateX(-50%) rotate(45deg)}
.snap-math{color:var(--muted);margin:2px 0 7px}
.snap-btns{display:flex;gap:6px}
.block{margin-top:14px}
.block h3{margin-bottom:6px}
.stable{width:100%;border-collapse:collapse;font-size:14px}
.stable th{font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--rule)}
.stable th:first-child,.stable td:first-child{text-align:left}
.stable td{text-align:right;padding:4px 6px}
.stable tr.trade td{font:600 15px 'Barlow Semi Condensed',sans-serif;padding-top:8px;border-left:4px solid var(--rule)}
.stable tr.tdata td{border-bottom:1px solid var(--rule);border-left:4px solid var(--rule)}
.stable tr.trade td:not(:first-child),.stable tr.tdata td:not(:first-child){border-left:0}
.stable tr.full td{background:var(--ts)}
.stable tr.full td:first-child{border-left-color:var(--tc)}
.stable tr.trade .sw{display:inline-block;margin-right:8px;vertical-align:-1px}
.stable tr.proj td{font-weight:600;border-top:2px solid var(--ink);padding-top:6px}
.status{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.status.st-done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.status.st-half{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.status.st-work{background:var(--info-soft);border-color:var(--ink);color:var(--ink)}
.budget{display:flex;height:28px;border-radius:6px;overflow:hidden;border:1px solid var(--rule)}
.budget-seg{display:grid;place-items:center;color:var(--on-trade);font-weight:600;font-size:12.5px;min-width:2px}
.budget-seg+.budget-seg{border-left:2px solid var(--panel)}
.budget-list{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.budget-list li{display:flex;align-items:center;gap:8px;padding:3px 0}
.budget-total{border-top:1px solid var(--rule);margin-top:3px;padding-top:6px!important;font-weight:600}
.hud{position:absolute;z-index:2;background:var(--panel);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hud-tl{left:10px;top:10px;padding:8px 10px 9px;width:210px}
.hud-day{display:flex;align-items:baseline;gap:6px}
.hud-day b{font:700 26px 'Barlow Semi Condensed',sans-serif;line-height:1}
.hud-day span,.hud-cost span{color:var(--muted);font-size:13px}
.hud-cost{font-size:14px;margin:2px 0 6px}
.hud-cost b{font-weight:600}
.hud-crews{list-style:none;margin:0;padding:6px 0 0;border-top:1px solid var(--rule);display:grid;gap:5px}
.hud-crews li{display:grid;grid-template-columns:1fr auto;column-gap:8px;font-size:13px}
.hud-crews .nm{font-weight:600}
.hud-crews .val{color:var(--muted);font-variant-numeric:tabular-nums}
.hud-crews .c-done .val{color:var(--good);font-weight:600}
.hud-crews .mini{grid-column:1/-1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:2px}
.hud-crews .mini i{display:block;height:100%}
.hud-tr{right:10px;top:10px;display:flex;gap:2px;padding:3px}
.cam{appearance:none;border:0;background:transparent;border-radius:7px;padding:5px 9px;font:500 13px 'Barlow',sans-serif;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cam i{width:8px;height:8px;border-radius:50%}
.cam:hover{background:var(--soft);color:var(--ink)}
.cam.on{background:var(--ink);color:var(--panel)}
.cam:focus-visible,.tb-play:focus-visible,.tb-speed button:focus-visible,.tl:focus-visible{outline:2px solid var(--flag-edge);outline-offset:2px}
.tbar{flex:none;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 12px}
.tb-play{appearance:none;flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--flag-edge);background:var(--flag);color:var(--flag-ink);font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.tb-play:hover{background:#F7C62E}
.tlw{flex:1;min-width:0;display:grid;grid-template-columns:auto auto 1fr;column-gap:8px;align-items:start}
.tl-ytitle{grid-row:1;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;font-weight:500;color:var(--muted);text-align:center;height:47px}
.tl-ylabels{grid-row:1;grid-column:2;position:relative;height:47px;min-width:76px}
.tl-ylabels span{position:absolute;right:0;font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.tl{grid-row:1;grid-column:3;position:relative;height:66px;cursor:pointer;touch-action:none;user-select:none}
.tl-lane{position:absolute;left:0;right:0;border-radius:3px;background:var(--soft)}
.tl-lane i{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.9}
.tl-grid{position:absolute;top:0;height:47px;width:1px;background:var(--rule);pointer-events:none}
.tl-done{position:absolute;left:0;top:0;height:47px;background:var(--ink);opacity:.07;border-radius:3px;pointer-events:none}
.tl-head{position:absolute;top:-2px;width:2px;height:51px;margin-left:-1px;background:var(--flag-edge);pointer-events:none}
.tl-head::after{content:"";position:absolute;left:50%;bottom:-5px;width:12px;height:12px;border-radius:50%;background:var(--flag);border:2px solid var(--flag-edge);transform:translateX(-50%)}

<!-- ═════════ CORE: data, rate/cost math, LOB conflict detection (plain JS) ═════════ -->
<script>
window.Core=(function(){
  var PJ=15840;            // 3 miles, per trade
  var MAXU=6;              // most machines one crew can field
  var STEP=0.1, EPS=0.5;   // sampling step (days), contact tolerance (ft)
  var TRADES=[
    {k:'exc', name:'Excavation', types:[
      {id:'small',    n:'Small Excavator',    r:165, c:900,  size:0.8},
      {id:'standard', n:'Standard Excavator', r:220, c:1600, size:1.0},
      {id:'large',    n:'Large Excavator',    r:330, c:2400, size:1.25}]},
    {k:'pipe',name:'Pipe laying', types:[
      {id:'standard', n:'Standard Crane',     r:180, c:2500, size:1.0},
      {id:'heavy',    n:'Heavy Crane',        r:270, c:3200, size:1.3}]},
    {k:'back',name:'Backfill', types:[
      {id:'small',    n:'Small Backfill Set',    r:180, c:1400, size:0.8},
      {id:'standard', n:'Standard Backfill Set', r:250, c:2300, size:1.0},
      {id:'large',    n:'Large Backfill Set',    r:375, c:3000, size:1.25}]}
  ];
  function units(t,e){return t.types.reduce(function(a,ty){return a+((e&&e[ty.id])||0)},0)}
  function rate(t,e){return t.types.reduce(function(a,ty){return a+((e&&e[ty.id])||0)*ty.r},0)}
  function cost(t,e){return t.types.reduce(function(a,ty){return a+((e&&e[ty.id])||0)*ty.c},0)}
  function dur(t,e){var r=rate(t,e);return r>0?Math.ceil(PJ/r):0}
  // footage reached at time t by a crew that starts at s and needs d days
  function pos(s,d,t){if(t<=s)return 0;if(t>=s+d)return PJ;return PJ*(t-s)/d}
  // Finish-to-start, no gap: a crew starts exactly on the day the crew before it finishes (start = predecessor end).
  function pairCheck(sP,dP,sF,dF){
    var eP=sP+dP,early=eP-sF;
    return {conflict:Math.abs(early)>1e-9,eP:eP,sF:sF,early:Math.max(0,early),wait:Math.max(0,-early)};
  }
  // starts, durs: arrays in trade order [exc,pipe,back]
  function check(starts,durs){
    var pairs=[pairCheck(starts[0],durs[0],starts[1],durs[1]),pairCheck(starts[1],durs[1],starts[2],durs[2])];
    return {pairs:pairs,clear:!pairs[0].conflict&&!pairs[1].conflict};
  }
  function domain(durs){var s=durs.reduce(function(a,b){return a+b},0);return Math.ceil((s+10)/20)*20}
  function stats(rates){
    var mn=Math.min.apply(null,rates),mx=Math.max.apply(null,rates);
    var mean=rates.reduce(function(a,b){return a+b},0)/rates.length;
    var sd=Math.sqrt(rates.reduce(function(a,b){return a+(b-mean)*(b-mean)},0)/(rates.length-1));
    return {rmr:mn/mx,cv:sd/mean};
  }
  return {PJ:PJ,MAXU:MAXU,TRADES:TRADES,units:units,rate:rate,cost:cost,dur:dur,pos:pos,pairCheck:pairCheck,check:check,domain:domain,stats:stats};
})();
</script>

const {useState,useRef,useEffect}=React;
const NOOP={down(){},move(){},up(){},leave(){},startDrag(){}};
const {TRADES,PJ,MAXU}=Core;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const money=n=>'$'+fmt(n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const tc=k=>`var(--${k})`;
const ts=k=>`var(--${k}-soft)`;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
/* One time scale everywhere: elapsed working days. A crew that starts at day S and needs D days finishes at day S + D. */
const span=(s,d)=>`day ${s} to day ${s+d}`;
const dailyOf=eq=>TRADES.reduce((a,t)=>a+Core.cost(t,eq[t.k]),0);
const fleetText=(t,e)=>{const p=t.types.filter(ty=>(e&&e[ty.id])>0).map(ty=>`${e[ty.id]} × ${ty.n}`);return p.length?p.join(', '):'none'};
/* Three Round 1 sites, each with a different bottleneck. Each one is pre-checked: several Round 2
   reallocations beat it on both duration and cost under the same daily budget. */
const SITES={
  A:{name:'Site A',eq:{exc:{standard:1},pipe:{standard:1,heavy:1},back:{large:2}}},          // excavation is the bottleneck
  B:{name:'Site B',eq:{exc:{large:2},pipe:{standard:1},back:{large:2}}},                     // pipe laying is the bottleneck
  C:{name:'Site C',eq:{exc:{large:2},pipe:{standard:1,heavy:1},back:{standard:1}}}           // backfill is the bottleneck
};
function pickSite(){
  try{const q=new URLSearchParams(location.search).get('site');if(q&&SITES[q.toUpperCase()])return q.toUpperCase()}catch(e){}
  const k=Object.keys(SITES);return k[Math.floor(Math.random()*k.length)];
}
const cloneEq=e=>JSON.parse(JSON.stringify(e));
/* Round 1 base rate for each crew: the player builds a crew that matches this rate and daily cost */
const targetOf=(site,i)=>{const t=TRADES[i],e=SITES[site].eq[t.k];return {r:Core.rate(t,e),c:Core.cost(t,e)}};
const meets=(site,i,eq)=>{const t=TRADES[i],g=targetOf(site,i);return Core.rate(t,eq[t.k])===g.r&&Core.cost(t,eq[t.k])===g.c};
function allFleets(t){const out=[],ids=t.types.map(x=>x.id);
  const rec=(k,cur,n)=>{if(k===ids.length){if(n>0)out.push({...cur});return}for(let c=0;c+n<=MAXU;c++){cur[ids[k]]=c;rec(k+1,cur,n+c)}};rec(0,{},0);return out}
/* Round 2 project duration as the game enforces it: crews before the first changed crew keep their
   Round 1 dates, the first changed crew keeps its start, every crew after it starts when the one ahead finishes */
function startsR2(r1,D2){
  const f=[0,1,2].find(i=>D2[i]!==r1.D[i]),st={},en=[];
  TRADES.forEach((t,i)=>{st[t.k]=(f==null||i<=f)?r1.starts[t.k]:en[i-1];en[i]=st[t.k]+D2[i]});
  return st;
}
function projectR2(r1,D2){
  const st=startsR2(r1,D2),en=TRADES.map((t,i)=>st[t.k]+D2[i]);
  return Math.max(...en)-Math.min(...TRADES.map(t=>st[t.k]));
}
const directOf=eq=>TRADES.reduce((a,t)=>a+Core.dur(t,eq[t.k])*Core.cost(t,eq[t.k]),0);
/* every reallocation that beats Round 1 on both duration and cost */
function r2Options(r1){
  const b=r1.slow[0],out=[];
  [0,1,2].filter(d=>d!==b).forEach(d=>{
    allFleets(TRADES[d]).forEach(ed=>allFleets(TRADES[b]).forEach(eb=>{
      if(Core.rate(TRADES[b],eb)<=r1.R[b])return;
      const eq={...cloneEq(r1.eq),[TRADES[d].k]:ed,[TRADES[b].k]:eb};
      if(dailyOf(eq)>r1.daily)return;
      const D2=TRADES.map(t=>Core.dur(t,eq[t.k])),T2=projectR2(r1,D2),C2=directOf(eq);
      if(T2<r1.project&&C2<r1.direct)out.push({d,eq,T:T2,C:C2});
    }));
  });
  const bestT=Math.min(...out.map(o=>o.T)),bestC=Math.min(...out.map(o=>o.C));
  return {list:out,bestT,bestC,byDonor:d=>out.filter(o=>o.d===d)};
}
function score(r1,T2,C2,opt){
  const part=(a,b,best)=>a===best?50:Math.max(0,Math.min(50,50*(a-b)/(a-best)));
  return Math.round(part(r1.project,T2,opt.bestT)+part(r1.direct,C2,opt.bestC));
}

function roundStats(eq,starts){
  const R=TRADES.map(t=>Core.rate(t,eq[t.k])),D=TRADES.map(t=>Core.dur(t,eq[t.k]));
  const ends=TRADES.map((t,i)=>starts[t.k]+D[i]),first=Math.min(...TRADES.map(t=>starts[t.k]));
  const minR=Math.min(...R);
  return {eq,starts,R,D,ends,first,last:Math.max(...ends),project:Math.max(...ends)-first,
    direct:TRADES.reduce((a,t,i)=>a+D[i]*Core.cost(t,eq[t.k]),0),daily:dailyOf(eq),
    slow:R.map((r,i)=>r===minR?i:-1).filter(i=>i>=0),minR};
}

function machinesFor(t,e){
  const list=[];
  t.types.forEach(ty=>{for(let i=0;i<((e&&e[ty.id])||0);i++)list.push(ty)});
  return list;
}

/* ───────── Line of Balance chart ───────── */
const LW=620,LHT=450,ML=72,MR=22,MT=30,MB=76,PW=LW-ML-MR,PH=LHT-MT-MB;

function LobChart({starts,durs,dom,plotK,chk,hover,svgRef,h,dragI,finalLocked,mini,cursor,ghost,focusI,label,revise,moves}){
  const xs=d=>ML+d/dom*PW, ys=f=>MT+PH-f/PJ*PH;
  const plotting=plotK<6,ti=Math.floor(plotK/2),isStart=plotK%2===0;
  const xStep=dom<=100?10:20,xMinor=dom<=100?2:5,xt=[],xm=[];
  for(let d=0;d<=dom;d+=xStep)xt.push(d);
  for(let d=0;d<=dom;d+=xMinor)if(d%xStep)xm.push(d);
  const yq=[];for(let q=1;q<12;q++)if(q%4)yq.push(q*1320);
  const canDrag=plotK===6&&!finalLocked;
  const lineTo=(s,d,t)=>[xs(t),ys(Core.pos(s,d,t))];
  return(
  <svg ref={svgRef} className={"lob"+(mini?" mini":"")} viewBox={`0 0 ${LW} ${LHT}`} role="img" aria-label="Line of Balance chart"
       style={{cursor:plotting?'crosshair':'default'}}
       onPointerDown={h.down} onPointerMove={h.move} onPointerUp={h.up} onPointerCancel={h.up} onPointerLeave={h.leave}>
    {/* grid: minor every quarter mile and every few days, major every mile and every 10/20 days */}
    <rect x={ML} y={MT} width={PW} height={PH} style={{fill:'var(--lane)'}}/>
    {xm.map(d=><line key={'xm'+d} x1={xs(d)} x2={xs(d)} y1={MT} y2={MT+PH} className="g-minor"/>)}
    {yq.map(f=><line key={'yq'+f} x1={ML} x2={ML+PW} y1={ys(f)} y2={ys(f)} className="g-minor"/>)}
    {xt.map(d=><line key={'xt'+d} x1={xs(d)} x2={xs(d)} y1={MT} y2={MT+PH} className="g-major"/>)}
    {[1,2,3].map(m=><line key={'ym'+m} x1={ML} x2={ML+PW} y1={ys(m*5280)} y2={ys(m*5280)} className="g-major"/>)}
    {xm.map(d=><line key={'tm'+d} x1={xs(d)} x2={xs(d)} y1={MT+PH} y2={MT+PH+4} style={{stroke:'var(--muted)'}} strokeWidth="0.8"/>)}
    {xt.map(d=><line key={'tt'+d} x1={xs(d)} x2={xs(d)} y1={MT+PH} y2={MT+PH+7} style={{stroke:'var(--muted)'}} strokeWidth="1"/>)}
    {[0,1,2,3].map(m=>(
      <g key={m}>
        <text className="ax" x={ML-10} y={ys(m*5280)+4} textAnchor="end">{m===0?'0':m+' mi'}</text>
        <text className="tick" x={ML-10} y={ys(m*5280)+17} textAnchor="end">{m===0?'':fmt(m*5280)+' ft'}</text>
      </g>))}
    {[0.5,1.5,2.5].map(m=><text key={'h'+m} className="tick" x={ML-10} y={ys(m*5280)+4} textAnchor="end">{m} mi</text>)}
    {xt.map(d=><text key={d} className="ax" x={xs(d)} y={MT+PH+21} textAnchor="middle">{d}</text>)}
    <text className="ax" x={ML+PW/2} y={LHT-6} textAnchor="middle">Time (days)</text>
    <line x1={ML} x2={ML+PW} y1={ys(0)} y2={ys(0)} style={{stroke:'var(--muted)'}} strokeWidth="1.2"/>
    <line x1={ML} x2={ML} y1={MT} y2={ys(0)} style={{stroke:'var(--muted)'}} strokeWidth="1.2"/>

    {/* end preview while waiting for the end point */}
    {plotting&&!isStart&&starts[TRADES[ti].k]!=null&&(()=>{const t=TRADES[ti],s0=starts[t.k],e0=s0+durs[ti],x=xs(e0),y=ys(PJ);return(
      <g pointerEvents="none">
        <line x1={xs(s0)} y1={ys(0)} x2={x} y2={y} stroke={tc(t.k)} strokeWidth="2.5" strokeDasharray="6 6" opacity="0.55"/>
        <circle className="pulse" cx={x} cy={y} r="14" fill="none" stroke={tc(t.k)} strokeWidth="3"/>
        <circle cx={x} cy={y} r="5" fill={tc(t.k)}/>
        <text className="lob-label halo" x={clamp(x,ML+70,ML+PW-70)} y={y+32} textAnchor="middle" fill={tc(t.k)} style={{fill:tc(t.k)}}>Click here · day {e0}</text>
        <text className="tick halo" x={clamp(x,ML+70,ML+PW-70)} y={y+47} textAnchor="middle" style={{fill:'var(--muted)'}}>day {s0} + {durs[ti]} days</text>
      </g>)})()}

    {/* plotting guide */}
    {plotting&&isStart&&ti>0&&starts[TRADES[ti-1].k]!=null&&(()=>{const p=TRADES[ti-1],eP=starts[p.k]+durs[ti-1];return(
      <g pointerEvents="none">
        <line x1={xs(eP)} x2={xs(eP)} y1={MT} y2={ys(0)} stroke={tc(TRADES[ti].k)} strokeWidth="1.8" strokeDasharray="5 4"/>
        <circle className="pulse" cx={xs(eP)} cy={ys(0)} r="9" fill="none" stroke={tc(TRADES[ti].k)} strokeWidth="2.5"/>
        <text className="tick halo" x={xs(eP)+6} y={MT+14} style={{fill:tc(TRADES[ti].k),fontWeight:600}}>{p.name} finishes day {eP}: start here</text>
      </g>)})()}
    {plotting&&(()=>{const t=TRADES[ti],row=ys(isStart?0:PJ);return(
      <g pointerEvents="none">
        <rect x={ML} y={row-14} width={PW} height="28" rx="6" fill={tc(t.k)} opacity="0.14"/>
        <line x1={ML} x2={ML+PW} y1={row} y2={row} stroke={tc(t.k)} strokeWidth="1.4" strokeDasharray="6 4"/>
        {hover!=null&&isStart&&<g>
          <line x1={xs(hover)} x2={xs(hover)} y1={MT} y2={ys(0)} stroke={tc(t.k)} strokeWidth="1" strokeDasharray="2 4"/>
          <circle cx={xs(hover)} cy={row} r="8" fill="none" stroke={tc(t.k)} strokeWidth="2"/>
          <text className="lob-label halo" x={xs(hover)} y={row+(isStart?-16:26)} textAnchor="middle" fill={tc(t.k)}>{isStart?`Start at day ${hover}`:`Finish day ${hover}`}</text>
        </g>}
      </g>)})()}

    {/* finish-to-start violations: follower starts before its predecessor has finished */}
    {plotK===6&&chk&&chk.pairs.map((c,pi)=>{
      if(!c.conflict)return null;
      const P=TRADES[pi],F=TRADES[pi+1],sF=c.sF,eP=c.eP;
      return(
      <g key={pi} pointerEvents="none">
        <rect x={xs(Math.min(sF,eP))} y={MT} width={Math.abs(xs(eP)-xs(sF))} height={PH} style={{fill:'var(--bad)'}} opacity="0.16"/>
        <line x1={xs(eP)} x2={xs(eP)} y1={MT} y2={ys(0)} style={{stroke:'var(--bad)'}} strokeWidth="1.8" strokeDasharray="5 4"/>
        <circle className="pulse" cx={xs(sF)} cy={ys(0)} r="13" fill="none" style={{stroke:'var(--bad)'}} strokeWidth="3"/>
        <text className="lob-label halo" x={clamp((xs(sF)+xs(eP))/2,ML+80,ML+PW-80)} y={MT+18+pi*20} textAnchor="middle" style={{fill:'var(--bad)'}}>{c.early?`${F.name} starts ${plural(c.early,'day')} too early`:`${F.name} waits ${plural(c.wait,'day')}`}</text>
      </g>)})}

    {/* Round 2: required new start for each downstream crew */}
    {revise&&revise.map(r=>{const t=TRADES[r.i];return(
      <g key={'rv'+t.k} pointerEvents="none">
        <line x1={xs(r.target)} x2={xs(r.target)} y1={MT} y2={ys(0)} stroke={tc(t.k)} strokeWidth="1.6" strokeDasharray="4 4"/>
        <line x1={xs(r.target)} y1={ys(0)} x2={xs(r.target+durs[r.i])} y2={ys(PJ)} stroke={tc(t.k)} strokeWidth="2.5" strokeDasharray="2 5" strokeLinecap="round" opacity="0.8"/>
        <circle className="pulse" cx={xs(r.target)} cy={ys(0)} r="9" fill="none" stroke={tc(t.k)} strokeWidth="2.5"/>
        <text className="tick halo" x={xs(r.target)+6} y={ys(0)-12-r.i*14} style={{fill:tc(t.k),fontWeight:600}}>Move {t.name.toLowerCase()} here: day {r.target}</text>
      </g>)})}

    {/* start dates that move: arrow from the old start to the new one */}
    {moves&&moves.map(m=>{const t=TRADES[m.i],x1=xs(m.from),x2=xs(m.to),y=ys(0)+18+m.i*0;const dir=x2>x1?1:-1;return(
      <g key={'mv'+t.k} pointerEvents="none">
        <line x1={x1} x2={x2-dir*6} y1={ys(0)-10} y2={ys(0)-10} stroke={tc(t.k)} strokeWidth="2"/>
        <path d={`M${x2},${ys(0)-10} l${-dir*8},-5 v10 z`} fill={tc(t.k)}/>
        <circle cx={x1} cy={ys(0)} r="5" fill="none" stroke={tc(t.k)} strokeWidth="1.8" strokeDasharray="2 2"/>
        <text className="tick halo" x={(x1+x2)/2} y={ys(0)-16} textAnchor="middle" style={{fill:tc(t.k),fontWeight:600}}>{t.name}: day {m.from} → {m.to}</text>
      </g>)})}

    {/* other-round lines, dashed */}
    {ghost&&TRADES.map((t,i)=>{const s0=ghost.starts[t.k];if(s0==null)return null;return(
      <line key={'gh'+t.k} x1={xs(s0)} y1={ys(0)} x2={xs(s0+ghost.durs[i])} y2={ys(PJ)} stroke={tc(t.k)} strokeWidth="2.5" strokeDasharray="8 6" opacity="0.45" pointerEvents="none"/>)})}

    {/* crew lines */}
    {TRADES.map((t,i)=>{
      const s=starts[t.k];if(s==null)return null;
      const hasS=plotK>i*2,hasE=plotK>i*2+1,e=s+durs[i];
      const bad=plotK===6&&chk&&((i>0&&chk.pairs[i-1].conflict)||(i<2&&chk.pairs[i].conflict));
      return(
      <g key={t.k} opacity={focusI!=null&&focusI!==i?0.22:1}>
        {hasE&&<line x1={xs(s)} y1={ys(0)} x2={xs(e)} y2={ys(PJ)} stroke={tc(t.k)} strokeWidth={dragI===i?5:3.5} strokeLinecap="round" pointerEvents="none"/>}
        {hasS&&<circle cx={xs(s)} cy={ys(0)} r="5.5" fill={tc(t.k)} style={{stroke:'var(--panel)'}} strokeWidth="2" pointerEvents="none"/>}
        {hasE&&<circle cx={xs(e)} cy={ys(PJ)} r="5.5" fill={tc(t.k)} style={{stroke:'var(--panel)'}} strokeWidth="2" pointerEvents="none"/>}
        {hasE&&<text className="lob-label halo" x={clamp(xs(e),ML+34,ML+PW-34)} y={ys(PJ)-12} textAnchor="middle" fill={tc(t.k)} pointerEvents="none">{t.name}{label&&focusI===i?` · ${label}`:''}</text>}
        {hasE&&<g pointerEvents="none">
          <line x1={xs(e)} y1={ys(PJ)} x2={xs(e)} y2={ys(0)} stroke={tc(t.k)} strokeWidth="1.4" strokeDasharray="4 4" opacity="0.75"/>
          <line x1={xs(e)} y1={ys(0)} x2={xs(e)} y2={ys(0)+30} stroke={tc(t.k)} strokeWidth="1.4"/>
          <rect x={xs(e)-27} y={ys(0)+30} width="54" height="18" rx="9" fill={tc(t.k)}/>
          <text x={xs(e)} y={ys(0)+43} textAnchor="middle" style={{fill:'#fff',fontSize:12,fontWeight:700}}>Day {e}</text>
        </g>}
        {hasE&&plotK===6&&i>0&&s!==starts[TRADES[i-1].k]+durs[i-1]&&<text className="tick halo" x={xs(s)+9} y={ys(0)-9} style={{fill:tc(t.k),fontWeight:600}} pointerEvents="none">Start {s}</text>}
        {canDrag&&<g>
          <line x1={xs(s)} y1={ys(0)} x2={xs(e)} y2={ys(PJ)} stroke="transparent" strokeWidth="26" strokeLinecap="round"
                style={{cursor:dragI===i?'grabbing':'ew-resize'}} onPointerDown={ev=>h.startDrag(i,ev)}/>
          <circle cx={xs(s)} cy={ys(0)} r="13" fill="transparent" style={{cursor:'ew-resize'}} onPointerDown={ev=>h.startDrag(i,ev)}/>
        </g>}
      </g>)})}

    {/* simulation day cursor */}
    {cursor!=null&&<g pointerEvents="none">
      <line x1={xs(cursor)} x2={xs(cursor)} y1={MT} y2={ys(0)} style={{stroke:'var(--flag-edge)'}} strokeWidth="2.5"/>
      {TRADES.map((t,i)=>{const s=starts[t.k];if(s==null||cursor<s)return null;const f=Core.pos(s,durs[i],cursor);
        return <circle key={t.k} cx={xs(Math.min(cursor,s+durs[i]))} cy={ys(f)} r="7" fill={tc(t.k)} style={{stroke:'var(--panel)'}} strokeWidth="2.5"/>})}
    </g>}
  </svg>);
}

/* ───────── small pieces ───────── */
function Callout({lvl,children}){return <div className={'callout '+(lvl||'info')} role="status">{children}</div>}
/* ⓘ tooltip: hover, focus or tap to see exact numbers */
function Info({children,label,s,name,right}){
  const [open,setOpen]=useState(false);
  const note=()=>{if(s&&s.note)s.note('tip',name||label||'info')};
  return(<span className={'tip'+(open?' open':'')+(right?' tip-r':'')} onMouseEnter={note}>
    <button type="button" className="tip-btn" aria-label={label||'More info'} aria-expanded={open}
      onClick={e=>{e.stopPropagation();setOpen(o=>!o);note()}} onBlur={()=>setOpen(false)}>i</button>
    <span className="tip-box" role="tooltip">{children}</span>
  </span>);
}
/* "Show details": collapsed by default */
function More({title,children,s,name}){
  return(<details className="more" onToggle={e=>{if(e.currentTarget.open&&s&&s.note)s.note('details',name||title)}}>
    <summary>{title}</summary><div className="more-body">{children}</div></details>);
}
/* a bar that fills toward a target mark and turns green when it matches */
function MatchBar({label,cur,target,color,f}){
  const ok=cur===target,over=cur>target,w=Math.min(target?cur/target:0,1.25)/1.25*100;
  return(<div className="mbar">
    <span className="mbar-l">{label}</span>
    <span className="mbar-track"><i style={{width:w+'%',background:ok?'var(--good)':over?'var(--bad)':color}}/><em/></span>
    <span className={'mbar-s'+(ok?' good-t':over?' bad-t':'')}>{(f||fmt)(cur)} / {(f||fmt)(target)}{ok?' ✓':''}</span>
  </div>);
}

function Stepper({value,onDec,onInc,decOff,incOff,label}){return(
  <div className="stepper">
    <button className="btn-icon" onClick={onDec} disabled={decOff} aria-label={`Remove one ${label}`}>−</button>
    <span className="stepper-val" aria-live="polite">{value}</span>
    <button className="btn-icon" onClick={onInc} disabled={incOff} aria-label={`Add one ${label}`}>+</button>
  </div>)}

/* Player ID = FAVORITE COLOR in capitals + "_" + last 4 digits, e.g. RED_1234 */
function PlayerId({s}){
  const init=/^([A-Z]+)_(\d{4})$/.exec(s.player||'');
  const [color,setColor]=useState(init?init[1]:''),[digits,setDigits]=useState(init?init[2]:'');
  const ok=color.length>=2&&/^\d{4}$/.test(digits),id=ok?`${color}_${digits}`:'';
  useEffect(()=>{s.setPlayer(id)},[id]);
  return(<div className="pid-box">
    <div className="pid-grid">
      <div>
        <label className="field-label" htmlFor="pid">Your favorite color</label>
        <input id="pid" className="note" value={color} placeholder="RED" autoComplete="off"
          onChange={ev=>setColor(ev.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,15))}/>
      </div>
      <div>
        <label className="field-label" htmlFor="pid4">Last 4 digits of your number</label>
        <input id="pid4" className="note" value={digits} placeholder="1234" inputMode="numeric" autoComplete="off"
          onChange={ev=>setDigits(ev.target.value.replace(/\D/g,'').slice(0,4))}/>
      </div>
    </div>
    <div className="pid-out">Your player ID: <b>{ok?id:(color||'COLOR')+'_'+(digits.padEnd(4,'•'))}</b></div>
    <div className="muted" style={{fontSize:12.5,marginTop:2}}>Use the same answers every time. Your results are saved for the study under this ID.</div>
  </div>)}

function IntroTab({s}){return(
  <div>
    <h1>Plan the pipeline.</h1>

/* fill-the-bar duration, shown under a crew's equipment card */
function DurFill({s,i}){
  const t=TRADES[i];if(s.U[i]===0)return null;
  const r=s.R[i],need=s.D[i],g=s.g[t.k],ft=g*r,pct=Math.min(ft/PJ,1)*100,ok=g===need,over=g>need,cost=Core.cost(t,s.eq[t.k]);
  const setG=v=>s.setGuess(t.k,clamp(v,0,130));
  if(s.locked[t.k]&&ok)return(
    <div className="dur-done" style={{borderLeftColor:tc(t.k)}}>
      <span className="grow"><b style={{color:'var(--good)'}}>✓ {plural(need,'day')}</b> <Info s={s} name={'cost-'+t.k} label="Crew cost">{plural(need,'day')} × {money(cost)}/day = {money(need*cost)}</Info></span>
      {s.canRedo(i)&&<button className="btn btn-sm" onClick={()=>s.unlockDur(t.k)}>Redo</button>}
    </div>);
  return(
    <section className="card dur-card" style={{borderTopColor:tc(t.k)}}>
      <div className="dur-head"><h3>Fill the bar</h3><Info s={s} name={'speed-'+t.k} label="Crew speed" right>Speed: {fmt(r)} ft/day<br/>Goal: {fmt(PJ)} ft</Info></div>
      <div className={'bar'+(ok?' ok':'')}>
        <div className="bar-fill" style={{width:pct+'%',background:over?'var(--bad)':tc(t.k)}}/>
        <div className="bar-text">{ok?'Full':over?'Too far':Math.round(pct)+'%'}</div>
      </div>
      <div className="slider-row" style={{marginTop:10}}>
        <button className="btn-icon" onClick={()=>setG(g-1)} disabled={g<=0} aria-label="One day less">−</button>
        <input className="slider" type="range" min="0" max="130" value={g} style={{'--c':tc(t.k)}} aria-label={`Days for ${t.name}`} onChange={ev=>setG(+ev.target.value)}/>
        <button className="btn-icon" onClick={()=>setG(g+1)} disabled={g>=130} aria-label="One day more">+</button>
      </div>
      <p className="readout">
        {ok?<><b style={{color:'var(--good)'}}>Full at {plural(need,'day')}</b> <span className="muted">· {fmt(PJ)} ÷ {fmt(r)}</span></>
          :over?<span style={{color:'var(--bad)'}}>Too far. Slide back.</span>
          :<b>{plural(g,'day')}</b>}
      </p>
      <div className="btn-row" style={{marginTop:8}}><button className="btn btn-primary" disabled={!ok} onClick={()=>s.lockDur(t.k)}>Lock in {ok?plural(need,'day'):'duration'}</button></div>
    </section>);
}

function EquipR2({s}){
  const r1=s.r1,bi=r1.slow[0],di=s.rev.donor,bt=TRADES[bi],dt=TRADES[di];

  const D2=s.D,ok=s.U.every(u=>u>0)&&[0,1,2].every(known),chk2=ok?Core.check(TRADES.map(x=>r1.starts[x.k]),D2):null;
  const cap=r1.daily,used=dailyOf(s.eq),over=used>cap;
  const freed=Core.cost(dt,r1.eq[dt.k])-Core.cost(dt,s.eq[dt.k]),spent=Core.cost(bt,s.eq[bt.k])-Core.cost(bt,r1.eq[bt.k]);
  const dd=ok?D2[di]-r1.D[di]:0,db=ok?D2[bi]-r1.D[bi]:0,net=dd+db;
  const sum1=r1.D.reduce((a,b)=>a+b,0),sum2=ok?D2.reduce((a,b)=>a+b,0):null;
  const st2=ok?startsR2(r1,D2):null;
  const endMax=Math.max(...TRADES.map((t,i)=>r1.starts[t.k]+r1.D[i]),...(ok?TRADES.map((t,i)=>st2[t.k]+D2[i]):[0]));
  const dom=Math.max(Math.ceil((endMax+5)/20)*20,Core.domain(r1.D));
  const moves=ok?[0,1,2].filter(i=>st2[TRADES[i].k]!==r1.starts[TRADES[i].k]).map(i=>({i,from:r1.starts[TRADES[i].k],to:st2[TRADES[i].k]})):[];

/* Round 2 checklist: every condition for "Continue to schedule", each with its own status, so a blocked player sees why */
function Gate({s}){
  const r1=s.r1,bi=r1.slow[0],di=s.rev.donor,bt=TRADES[bi],dt=TRADES[di];
  const cap=r1.daily,used=dailyOf(s.eq);
  const changed=[di,bi].filter(i=>s.R[i]!==r1.R[i]);
  const barsOpen=TRADES.filter((t,i)=>!(s.locked[t.k]&&s.g[t.k]===s.D[i]));
  const faster=s.changedR2,inBudget=used<=cap,locked=barsOpen.length===0&&s.fleetOk;
  const known=locked&&s.fleetOk,T2=known?s.projT:null,C2=known?s.projC:null;
  const tOk=known&&T2<r1.project,cOk=known&&C2<r1.direct;
  const hint=s.rev.hints||0,opt=s.opt;
  const sugg=opt.byDonor(di).slice().sort((a,b)=>a.T-b.T||a.C-b.C)[0];
  const items=[
    {ok:faster,short:`${bt.name} faster`,l:`${bt.name} is faster than in Round 1`,why:faster?`${fmt(r1.R[bi])} → ${fmt(s.R[bi])} ft/day`:`Add or upgrade ${bt.name.toLowerCase()} machines. Now ${fmt(s.R[bi])} ft/day, Round 1 ${fmt(r1.R[bi])}.`},
    {ok:inBudget,short:'Within budget',l:'Daily cost within the Round 1 budget',why:inBudget?`${money(used)} of ${money(cap)}`:`${money(used-cap)} over. Downsize ${dt.name.toLowerCase()} more, or pick a cheaper ${bt.name.toLowerCase()} machine.`},
    {ok:locked,short:'Days locked',l:'Every changed crew has its duration locked',why:locked?'All bars full':`Fill and lock the bar for ${barsOpen.map(t=>t.name.toLowerCase()).join(' and ')||'each crew'}.`},
    {ok:tOk,short:known?`Shorter · ${T2} d`:'Shorter',l:'Shorter than Round 1',why:!known?'Shown once the bars are locked':tOk?`${r1.project} → ${T2} days (${r1.project-T2} d shorter)`:`${r1.project} → ${T2} days. ${bt.name} must gain more days than ${dt.name.toLowerCase()} loses.`},
    {ok:cOk,short:known?`Cheaper · ${money(C2)}`:'Cheaper',l:'Cheaper than Round 1',why:!known?'Shown once the bars are locked':cOk?`${money(r1.direct)} → ${money(C2)}`:`${money(r1.direct)} → ${money(C2)}. Use machines with a lower cost per foot.`}];
  const pass=items.every(x=>x.ok);
  const Row=({lbl,a,b,ok,f})=>(<div className={'out-row '+(b==null?'':ok?'ok':'no')}>
    <span className="out-l">{lbl}</span><span className="out-v">{f(a)} → <b>{b==null?'?':f(b)}</b></span>
    <span className="out-s">{b==null?'':ok?'✓ better':'✗ not yet'}</span></div>);
  return(<section className="gate">
    <div className="gate-head"><h3>Beat Round 1</h3></div>
    {!s.fleetOk&&<p className="gate-note bad-t">Every crew needs at least one machine.</p>}
    <Row lbl="Days" a={r1.project} b={known?T2:null} ok={tOk} f={v=>plural(v,'day')}/>
    <Row lbl="Cost" a={r1.direct} b={known?C2:null} ok={cOk} f={money}/>
    {pass&&<p className="gate-note good-t">Both better. Best possible on this site: {plural(opt.bestT,'day')} and {money(opt.bestC)}.</p>}
    {!pass&&changed.length>0&&hint===0&&<button className="btn btn-sm" onClick={()=>s.useHint(1)}>Show a hint</button>}
    {!pass&&hint>=1&&<div className="hint">
      <b>Cost per foot</b> (daily cost ÷ ft per day): lower is cheaper for the same 15,840 ft.
      <table className="stable cpf"><tbody>{[di,bi].map(i=>TRADES[i].types.map(ty=><tr key={TRADES[i].k+ty.id}><td><span className="sw" style={{background:tc(TRADES[i].k),display:'inline-block',marginRight:6}}/>{ty.n}</td><td>{ty.r} ft/day</td><td>${(ty.c/ty.r).toFixed(2)}/ft</td></tr>))}</tbody></table>
      {hint===1&&<button className="btn btn-sm" onClick={()=>s.useHint(2)}>Show a mix that works</button>}
    </div>}
    {!pass&&hint>=2&&sugg&&<div className="hint">One mix that works: {[di,bi].map(i=><span key={i}><b style={{color:tc(TRADES[i].k)}}>{TRADES[i].name}</b> {fleetText(TRADES[i],sugg.eq[TRADES[i].k])}. </span>)}</div>}
  </section>);
}

function Budget({s}){
  const {D,eq}=s;
  const parts=TRADES.map((t,i)=>{const c=Core.cost(t,eq[t.k]);return {t,d:D[i],c,v:D[i]*c}});
  const total=parts.reduce((a,p)=>a+p.v,0);
  return(<section className="block">
    <div className="sum-line"><b>Budget: {money(total)}</b></div>
    <div className="budget" role="img" aria-label={`Total ${money(total)}`}>
      {parts.map(p=><div key={p.t.k} className="budget-seg" style={{width:(p.v/total*100)+'%',background:tc(p.t.k)}} title={`${p.t.name}: ${money(p.v)}`}>
        {p.v/total>0.14&&<span>{Math.round(p.v/total*100)}%</span>}
      </div>)}
    </div>
    <More title="Show budget breakdown" s={s} name="budget">
    <ul className="budget-list">
      {parts.map(p=><li key={p.t.k}><span className="sw" style={{background:tc(p.t.k)}}/><span className="grow">{p.t.name} <span className="muted">({p.d}d × {money(p.c)})</span></span><b>{money(p.v)}</b></li>)}
      <li className="budget-total"><span className="grow">Total</span><b>{money(total)}</b></li>
    </ul>
    </More>
  </section>)}

/* ───────── Review (between rounds) ───────── */

function DonorPick({s}){
  const r1=s.r1,rv=s.rev,opts=TRADES.map((t,i)=>i).filter(i=>!r1.slow.includes(i));
  const fastest=opts.reduce((a,i)=>r1.R[i]>r1.R[a]?i:a,opts[0]),d=rv.donor,opt=s.opt;
  const wins=i=>opt.byDonor(i),bestOf=i=>Math.min(...wins(i).map(o=>o.T));
  return(<section style={{marginTop:16}}>
    <h3 style={{marginBottom:4}}>Which crew can give up some of its budget?</h3>
    <p className="muted" style={{fontSize:14,margin:'0 0 8px'}}>Round 2 has the same daily budget as Round 1 ({money(r1.daily)}). To speed up the bottleneck, another crew must give up machines.</p>
    <div className="pick two" role="group" aria-label="Donor crew">
      {opts.map(i=>{const t=TRADES[i];return(
        <button key={t.k} onClick={()=>s.pickDonor(i)} aria-pressed={d===i}
          className={'pick-b'+(d===i?(wins(i).length?' right':' wrong'):'')} style={{'--tc':tc(t.k)}}>
          <span className="pick-n" style={{color:tc(t.k)}}>{t.name}</span>
          <span className="muted">{fmt(r1.R[i])} ft/day · {money(Core.cost(t,r1.eq[t.k]))}/day</span>
        </button>)})}
    </div>
    {d!=null&&(!wins(d).length
      ?<Callout lvl="warn"><b>No mix with {TRADES[d].name.toLowerCase()} as the donor beats Round 1.</b> Pick the other crew.</Callout>
      :d===fastest||bestOf(d)<=Math.min(...opts.map(bestOf))
        ?<Callout lvl="ok"><b>Good choice.</b> {TRADES[d].name} can give up budget and still let Round 2 beat Round 1.</Callout>
        :<Callout lvl="ok"><b>This can work.</b> Round 2 can beat Round 1 with {TRADES[d].name.toLowerCase()} as the donor, though {TRADES[opts.find(i=>i!==d)].name.toLowerCase()} allows a bigger saving.</Callout>)}
    <div className="btn-row" style={{marginTop:12}}>
      <button className="btn btn-primary" disabled={d==null||!wins(d).length} onClick={()=>{s.setActiveEq(TRADES[r1.slow[0]].k);s.setTab('equip')}}>Reallocate the budget</button>
    </div>
  </section>)}

function Delta({a,b,fmtv,better}){
  const d=b-a,pc=a?d/a*100:0,good=better==='lower'?d<0:better==='higher'?d>0:null;
  const cls=d===0||good===null?'flat':good?'good':'bad';
  return <span className={'delta '+cls}>{d===0?'no change':`${d<0?'▼':'▲'} ${fmtv(Math.abs(d))} (${Math.abs(pc)<1?'<1':Math.abs(pc).toFixed(0)}%)`}</span>;
}

/* ───────── total duration: Round 1 vs Round 2, drawn on one time axis ───────── */
function DurCompare({a,b,bLive}){
  const rows=[['Round 1',a],['Round 2',b]].filter(r=>r[1]);
  const end=Math.max(...rows.map(r=>r[1].last)),dom=Math.max(10,Math.ceil(end/20)*20);
  const pct=d=>(d/dom*100)+'%';
  const step=dom<=100?10:20,ticks=[];for(let d=0;d<=dom;d+=step)ticks.push(d);
  const diff=a&&b?b.project-a.project:null;
  return(<section className="durc">
    <div className="durc-head">
      <h3>Total duration</h3>
      {diff!=null&&<span className={'delta '+(diff<0?'good':diff>0?'bad':'flat')}>{diff===0?'no change':`${diff<0?'▼':'▲'} ${Math.abs(diff)} days (${Math.abs(diff/a.project*100).toFixed(0)}%)`}</span>}
    </div>
    {rows.map(([l,r])=>(
      <div className="durc-row" key={l}>
        <span className="rl">{l}</span>
        <div className="durc-track">
          {ticks.map(d=><i key={d} className="durc-grid" style={{left:pct(d)}}/>)}
          {TRADES.map((t,i)=><span key={t.k} className="durc-seg" title={`${t.name}: day ${r.starts[t.k]} to day ${r.ends[i]}`}
            style={{left:pct(r.starts[t.k]),width:pct(r.D[i]),background:tc(t.k)}}>{r.D[i]/dom>=0.06?r.D[i]+' d':''}</span>)}
          <b className="durc-end" style={{left:pct(r.last)}}>{r.project} d{l==='Round 2'&&bLive?' (now)':''}</b>
        </div>
      </div>))}
    <div className="durc-row"><span/><div className="durc-axis">{ticks.map(d=><span key={d} style={{left:pct(d)}}>{d}</span>)}</div></div>
    <div className="durc-x">Time (days)</div>
  </section>);
}

/* ───────── 3D site simulation ───────── */
const HEX={exc:0x2F6FB5,pipe:0x2A8A55,back:0xD4701C};
const L3=240, ftX=ft=>ft/PJ*L3, SPACING=6.5;
const LANE={exc:{z:3.2,ry:0.45,tagY:8},pipe:{z:5.8,ry:0,tagY:12.5},back:{z:0,ry:0,tagY:6.5}};

function crewAt(i,starts,durs,t){
  const k=TRADES[i].k,s=starts[k],d=durs[i];
  if(s==null||t<s)return {st:'wait',ft:0,x:-14,s,d};
  if(t>=s+d)return {st:'done',ft:PJ,x:L3+14,s,d};
  const ft=Core.pos(s,d,t);return {st:'work',ft,x:ftX(ft),s,d};
}
function crewStatus(c){
  return c.st==='wait'?`Starts at day ${c.s}`:c.st==='done'?`Finished at day ${c.s+c.d}`:`${fmt(c.ft)} of ${fmt(PJ)} ft`;
}
function matCache(){const c={};return (col,o)=>{const key=col+JSON.stringify(o||{});return c[key]||(c[key]=new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.7},o||{})))}}
function part(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m}
const BOX=(a,b,c)=>new THREE.BoxGeometry(a,b,c);

function buildExcavator(M,col){
  const g=new THREE.Group(),dark=M(0x2B2F33),steel=M(0x4A5056),glass=M(0xBFDCEB,{roughness:.2,metalness:.3}),body=M(col);
  g.add(part(BOX(4.2,.8,.9),dark,0,.4,1.0));g.add(part(BOX(4.2,.8,.9),dark,0,.4,-1.0));
  const up=new THREE.Group();up.position.y=.8;g.add(up);
  up.add(part(BOX(3,1.1,2.4),body,-.2,.55,0));
  up.add(part(BOX(.8,1,2.4),steel,-1.9,.55,0));
  up.add(part(BOX(1.2,1.2,1),body,.6,1.65,.65));
  up.add(part(BOX(.06,.7,.8),glass,1.23,1.75,.65));
  const arm=new THREE.Group();arm.position.set(1.1,1.2,-.35);up.add(arm);
  arm.add(part(BOX(3.4,.42,.42),body,1.7,0,0));
  const stick=new THREE.Group();stick.position.set(3.4,0,0);arm.add(stick);
  stick.add(part(BOX(2.6,.32,.32),body,1.3,0,0));
  stick.add(part(BOX(.8,.8,.9),steel,2.7,-.2,0));
  arm.rotation.z=.5;stick.rotation.z=-1.9;
  return {g,tick:t=>{arm.rotation.z=.45+.18*Math.sin(t*2.2);stick.rotation.z=-1.85+.3*Math.sin(t*2.2+1.1)}};
}
function buildCrane(M,col){
  const g=new THREE.Group(),dark=M(0x1E2327),steel=M(0x4A5056),glass=M(0xBFDCEB,{roughness:.2,metalness:.3}),body=M(col),pipeM=M(0x9AA4A8,{metalness:.4,roughness:.4});
  g.add(part(BOX(5,.9,2.4),steel,0,1.05,0));
  [-1.7,1.7].forEach(x=>[-1.15,1.15].forEach(z=>{const w=part(new THREE.CylinderGeometry(.62,.62,.5,14),dark,x,.62,z);w.rotation.x=Math.PI/2;g.add(w)}));
  const up=new THREE.Group();up.position.y=1.5;up.rotation.y=1.14;g.add(up);
  up.add(part(BOX(2.4,1.1,2),body,-.7,.55,0));
  up.add(part(BOX(1,1.1,.8),body,.9,.55,.75));
  up.add(part(BOX(.06,.6,.6),glass,1.42,.65,.75));

  }
  if(tab==='review'){
    if(!rev.correct)return rev.picks.length?say(`Not that one. Look for the flattest line: that's the slowest crew.`,'alert'):say(`Round 1 took ${r1.project} days. Look at the chart. Which crew held us back?`);
    const b=r1.slow[0];
    if(rev.donor==null)return say(`Right, ${lc(b)}. We can't spend more per day, so another crew has to give up some budget. Which one?`);
    return say(`OK, ${lc(rev.donor)} gives, ${lc(b)} gets. Let's reallocate.`,'good');
  }
  if(tab==='equip'&&round===2){
    const b=r1.slow[0],d=rev.donor;
    const open=TRADES.filter((t,j)=>!(locked[t.k]&&g[t.k]===D[j]));
    if(!changedR2)return say(`Speed up ${lc(b)} with money you free up from ${lc(d)}.`);
    if(overCap)return say(`We're ${money(dailyOf(eq)-r1.daily)} a day over budget. Trim ${lc(d)} some more.`,'alert');
    if(open.length)return say(`Fill the bar for ${open.map(t=>t.name.toLowerCase()).join(' and ')}, so we know the new days.`);
    if(projT>=r1.project)return say(`That makes the job ${projT===r1.project?'no shorter':'longer'}: ${projT} days against ${r1.project}. ${nm(b)} has to gain more days than ${lc(d)} loses.`,'alert');
    if(projC>=r1.direct)return say(`Faster, but it costs ${money(projC-r1.direct)} more. Try machines with a lower cost per foot.`,'alert');
    return say(`That beats Round 1: ${projT} days and ${money(projC)}. Let's fix the schedule.`,'good');
  }
  if(tab==='lob'){
    if(plotK<6){
      const i=Math.floor(plotK/2);
      const s0=starts[TRADES[i].k];
      return say(i===0?`Excavation starts on day 0. Click the ring where it finishes.`:`${nm(i)} starts the day ${lc(i-1)} finishes. Click the ring to draw it.`);
    }
    if(round===2&&revise.length){const r=revise[0];return say(`${nm(r.i)} has to start the moment ${lc(r.i-1)} finishes. Drag it to day ${r.target}.`,'alert');}
    if(chk&&!chk.clear){const pi=chk.pairs.findIndex(p=>p.conflict),c=chk.pairs[pi];return say(c.early?`${nm(pi+1)} starts before ${lc(pi)} finishes. Drag it to day ${c.eP}.`:`${nm(pi+1)} is waiting ${plural(c.wait,'day')}. Drag it to day ${c.eP}, the day ${lc(pi)} finishes.`,'alert');}
    if(ready&&simDay>=endDay&&endDay>0)return round===1?say(`Round 1 done: ${Math.max(...TRADES.map((t,i)=>starts[t.k]+D[i]))} days. I think we can do better. Start Round 2.`,'good')
      :say(`Round 2 done: ${projT} days against ${r1.project}. Let's compare.`,'good');
    if(playing)return say(`Crews are rolling. Watch the cursor on the chart follow the site.`);
    if(simDay>0)return say(`Paused on day ${Math.floor(simDay)}. Press play when you're ready.`);
    return say(`The schedule is clean. Press Play and watch the site.`,'good');
  }
  if(tab==='cmp')return cmpScore?say(`Round 2: ${cmpScore.T} days and ${money(cmpScore.C)}. The best possible here was ${opt.bestT} days and ${money(opt.bestC)}. Write down what worked in the plus and delta boxes.`,'good'):null;
  return null;
}

/* one sheet row per completed round */
function roundFields(ctx){
  const {st,round,site,player,attempt,misses,secs,rev,r1}=ctx,f={};
  f['Session ID']=SESSION_ID;f['Player ID']=player;f['Site']=SITES[site].name;f['Round']=round;f['Attempt']=attempt;
  TRADES.forEach((t,i)=>{const e=st.eq[t.k],c=Core.cost(t,e);
    f[`${t.name} equipment`]=fleetText(t,e);f[`${t.name} machines`]=Core.units(t,e);
    f[`${t.name} rate (ft/day)`]=st.R[i];f[`${t.name} daily cost ($)`]=c;f[`${t.name} duration (days)`]=st.D[i];
    f[`${t.name} start (day)`]=st.starts[t.k];f[`${t.name} end (day)`]=st.ends[i];f[`${t.name} cost ($)`]=st.D[i]*c;});
  const ss=Core.stats(st.R);
  f['Project duration (days)']=st.project;f['Direct cost ($)']=st.direct;f['Daily cost ($)']=st.daily;
  f['Bottleneck']=st.slow.map(i=>TRADES[i].name).join(' + ');f['RMR']=r2d(ss.rmr,3);f['CV']=r2d(ss.cv,3);
  f['LOB data']=JSON.stringify(TRADES.map((t,i)=>({crew:t.name,start:st.starts[t.k],end:st.ends[i],rate:st.R[i]})));
  f['Plotting misses']=misses;f['Time on round (s)']=secs;
  if(round===2&&rev&&r1){f['Bottleneck picks']=rev.picks.map(i=>TRADES[i].name).join(' > ');f['Donor']=rev.donor!=null?TRADES[rev.donor].name:'';
    f['Donor picks']=(rev.donorPicks||[]).map(i=>TRADES[i].name).join(' > ');f['Hints used']=rev.hints||0;}
  return f;
}
/* one sheet row comparing both rounds */
function compareFields(ctx){
  const {a,b,site,player,refl,opt,attempt}=ctx,f={};
  const sa=Core.stats(a.R),sb=Core.stats(b.R);
  f['Session ID']=SESSION_ID;f['Player ID']=player;f['Site']=SITES[site].name;f['Submission']=attempt;
  f['R1 project duration (days)']=a.project;f['R2 project duration (days)']=b.project;
  f['Time improvement (%)']=r2d((a.project-b.project)/a.project*100,1);
  TRADES.forEach((t,i)=>{
    f[`${t.name} R1 rate (ft/day)`]=a.R[i];f[`${t.name} R2 rate (ft/day)`]=b.R[i];
    f[`${t.name} productivity improvement (%)`]=pct(a.R[i],b.R[i]);
    f[`${t.name} time improvement (%)`]=r2d((a.D[i]-b.D[i])/a.D[i]*100,1);});
  const P=st=>3*PJ/st.project;                                   // overall productivity: all work ÷ project days
  f['Overall productivity R1 (ft/day)']=r2d(P(a),1);f['Overall productivity R2 (ft/day)']=r2d(P(b),1);
  f['Overall productivity improvement (%)']=pct(P(a),P(b));
  f['R1 direct cost ($)']=a.direct;f['R2 direct cost ($)']=b.direct;f['Cost change (%)']=pct(a.direct,b.direct);
  f['R1 RMR']=r2d(sa.rmr,3);f['R2 RMR']=r2d(sb.rmr,3);f['R1 CV']=r2d(sa.cv,3);f['R2 CV']=r2d(sb.cv,3);
  f['Duration improvement (days)']=a.project-b.project;f['Cost improvement ($)']=a.direct-b.direct;
  if(opt){f['Best possible duration (days)']=opt.bestT;f['Best possible cost ($)']=opt.bestC;
    f['Gap to best duration (days)']=b.project-opt.bestT;f['Gap to best duration (%)']=r2d((b.project-opt.bestT)/opt.bestT*100,1);
    f['Gap to best cost ($)']=b.direct-opt.bestC;f['Gap to best cost (%)']=r2d((b.direct-opt.bestC)/opt.bestC*100,1);}
  f['Plus']=refl.plus.trim();f['Delta']=refl.delta.trim();
  return f;
}
/* send to the sheet; failures wait in this browser and retry on the next send */
const QKEY='lob-log-queue';
function readQ(){try{return JSON.parse(localStorage.getItem(QKEY)||'[]')}catch(e){return []}}
function writeQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q.slice(-20)))}catch(e){}}
async function postOne(body){
  await fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
}
/* each log gets a one-time ID; an item already being sent is never sent again in parallel,
   and the sheet skips any ID it has already written */
const SENDING=new Set();
const newQid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function sendLog(body){
  if(!LOG_URL)return 'off';
  body.qid=body.qid||newQid();body.fields=Object.assign({},body.fields,{'Log ID':body.qid});
  writeQ(readQ().map(x=>x.qid?x:{...x,qid:newQid()}).concat([body]));
  let failed=false;
  for(const item of readQ()){
    if(SENDING.has(item.qid))continue;
    SENDING.add(item.qid);
    try{await postOne(item);writeQ(readQ().filter(x=>x.qid!==item.qid))}
    catch(e){if(item.qid===body.qid)failed=true}
    finally{SENDING.delete(item.qid)}
  }
  return failed?'queued':'sent';
}

  const [dragI,setDragI]=useState(null);
  const svgRef=useRef(null);
  const [simDay,setSimDay]=useState(0);
  const simRef=useRef(0);
  const [playing,setPlaying]=useState(false);
  const [speed,setSpeed]=useState(8);
  const [cam,setCam]=useState('overview');
  const [round,setRound]=useState(1);
  const [r1,setR1]=useState(null);
  const [rev,setRev]=useState({picks:[],correct:false,note:'',donor:null,donorPicks:[],hints:0});
  const [refl,setRefl]=useState({plus:'',delta:''});
  const [player,setPlayer]=useState('');
  const [logStat,setLogStat]=useState({1:null,2:null,cmp:null});
  const uiUse=useRef({tips:new Set(),details:new Set()});
  function note(kind,name){const u=uiUse.current;(kind==='tip'?u.tips:u.details).add(String(name))}
  const attempts=useRef({1:0,2:0,cmp:0}),missTotal=useRef(0),roundT0=useRef(null),cmpSentSig=useRef('');
  const [doneR,setDoneR]=useState({1:false,2:false});
  const [cmpR,setCmpR]=useState(2);
  const cmpRef=useRef(null);

  const R=TRADES.map(t=>Core.rate(t,eq[t.k])),U=TRADES.map(t=>Core.units(t,eq[t.k])),D=TRADES.map(t=>Core.dur(t,eq[t.k]));
  const fleetOk=U.every(u=>u>=1);
  const durDone=TRADES.every((t,i)=>locked[t.k]&&g[t.k]===D[i]&&D[i]>0)&&(round===2||[0,1,2].every(i=>meets(site,i,eq)));
  const DOM=round===2&&r1?Math.max(Core.domain(D),Core.domain(r1.D),Math.ceil((Math.max(...TRADES.map((t,i)=>r1.starts[t.k]+r1.D[i]))+Math.max(...D)+5)/20)*20):Core.domain(D);
  const changedR2=round===2&&r1?r1.slow.some(i=>R[i]>r1.R[i]):false;     // bottleneck sped up
  const overCap=round===2&&r1?dailyOf(eq)>r1.daily:false;
  const opt=React.useMemo(()=>r1?r2Options(r1):null,[r1]);
  const projT=round===2&&r1&&fleetOk?projectR2(r1,D):null,projC=round===2&&fleetOk?directOf(eq):null;
  const gatePass=round===2&&r1&&changedR2&&!overCap&&durDone&&projT<r1.project&&projC<r1.direct;
  const prevRef=useRef(null);
  const chk=plotK===6?Core.check(TRADES.map(t=>starts[t.k]),D):null;
  const clear=!!(chk&&chk.clear);
  /* Round 2: every crew after the bottleneck must start exactly when the crew ahead now finishes */
  const bIdx=round===2&&r1?Math.min(...r1.slow,...(rev.donor!=null&&R[rev.donor]!==r1.R[rev.donor]?[rev.donor]:[])):-1;   // first crew whose rate changed
  const revise=(round===2&&r1&&plotK===6)?TRADES.map((t,i)=>(i>0&&i>bIdx)?{i,target:starts[TRADES[i-1].k]+D[i-1],cur:starts[t.k]}:null).filter(x=>x&&x.cur!==x.target):[];
  const ready=clear&&revise.length===0;
  /* the run being shown: the current round, or the round picked for replay on Compare */
  const ctx=((tab==='cmp'&&cmpR===1)||tab==='review'||tab==='r1view')&&r1?{eq:r1.eq,starts:r1.starts,D:r1.D}:{eq,starts,D};
  const endDay=(tab==='cmp'||tab==='review'||tab==='r1view'||plotK===6)?Math.max(...TRADES.map((t,i)=>ctx.starts[t.k]+ctx.D[i])):0;
  const simDone=ready&&endDay>0&&simDay>=endDay;
  const curSig=JSON.stringify(starts)+'|'+D.join(',');
  const schedSig=curSig+'|'+tab+'|'+cmpR;
  useEffect(()=>{setPlaying(false);simRef.current=0;setSimDay(0)},[schedSig]);
  useEffect(()=>{setDoneR(x=>({...x,[round]:false}))},[curSig]);
  useEffect(()=>{if(tab==='lob'&&simDone&&!doneR[round]){setDoneR(x=>({...x,[round]:true}));logRound(round)}},[tab,simDone]);
  useEffect(()=>{if(tab!=='intro'&&roundT0.current==null)roundT0.current=Date.now()},[tab]);
  async function logRound(n){
    if(!LOG_URL)return;
    const st=roundStats(eq,starts);attempts.current[n]++;
    const fields=roundFields({st,round:n,site,player,attempt:attempts.current[n],misses:missTotal.current,
      secs:roundT0.current?Math.round((Date.now()-roundT0.current)/1000):'',rev,r1});
    fields['Tooltips opened']=[...uiUse.current.tips].join(', ');fields['Details opened']=[...uiUse.current.details].join(', ');
    uiUse.current={tips:new Set(),details:new Set()};
    setLogStat(x=>({...x,[n]:'sending'}));
    const png=await svgToPng(lobSvgString(st,`${player||'Player'} · ${SITES[site].name} · Round ${n} · ${st.project} days`));
    const res=await sendLog({type:'round',sheet:'Rounds',fields,lobPng:png,chartName:`${player||SESSION_ID}_${SITES[site].name}_R${n}_a${attempts.current[n]}.png`});
    setLogStat(x=>({...x,[n]:res}));
  }
  async function submitReflection(){
    if(!r1)return;
    const b=roundStats(eq,starts);
    attempts.current.cmp++;
    setLogStat(x=>({...x,cmp:'sending'}));
    const fields=compareFields({a:r1,b,site,player,refl,opt,attempt:attempts.current.cmp});
    fields['Details opened']=[...uiUse.current.details].join(', ');fields['Tooltips opened']=[...uiUse.current.tips].join(', ');
    const png=LOG_URL?await svgToPng(lobCompareSvg(r1,b,`${player||'Player'} · ${SITES[site].name} · Round 1 vs Round 2`)):'';
    const rpng=LOG_URL?await svgToPng(resultsSvg(r1,b,`${player||'Player'} · ${SITES[site].name} · Round 1 vs Round 2 results`)):'';
    const res=LOG_URL?await sendLog({type:'compare',sheet:'Comparison',fields,resultsPng:rpng,resultsName:`${player||SESSION_ID}_${SITES[site].name}_results_s${attempts.current.cmp}.png`,lobPng:png,chartName:`${player||SESSION_ID}_${SITES[site].name}_R1vsR2_s${attempts.current.cmp}.png`}):'off';
    cmpSentSig.current=refl.plus+'|'+refl.delta;
    setLogStat(x=>({...x,cmp:res}));
  }
  useEffect(()=>{if(tab!=='lob'&&tab!=='cmp'&&tab!=='review'&&tab!=='r1view')setPlaying(false)},[tab]);
  const [lastR2Tab,setLastR2Tab]=useState('review');
  useEffect(()=>{if(round===2&&tab!=='r1view')setLastR2Tab(tab)},[tab,round]);
  useEffect(()=>{
    if(!playing)return;
    let raf,last=performance.now(),lastQ=-1;
    const step=now=>{
      const dt=Math.min((now-last)/1000,.1);last=now;
      let d=Math.min(simRef.current+dt*speed,endDay);simRef.current=d;
      const q=Math.round(d*5)/5;if(q!==lastQ){lastQ=q;setSimDay(q)}
      if(d>=endDay){setSimDay(endDay);setPlaying(false);return}
      raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[playing,speed,endDay]);
  function snapStart(i,v){setStarts(x=>({...x,[TRADES[i].k]:v}))}
  function togglePlay(){if(!ready&&tab!=='cmp'&&tab!=='review'&&tab!=='r1view')return;if(!playing&&simRef.current>=endDay){simRef.current=0;setSimDay(0)}setPlaying(p=>!p)}
  function restart(){simRef.current=0;setSimDay(0);setPlaying(false)}
  function scrub(ev){seek(+ev.target.value)}
  function seek(v){simRef.current=v;setSimDay(Math.round(v*5)/5);setPlaying(false)}

  function pickBottleneck(i,right){setRev(x=>({...x,picks:x.picks.includes(i)?x.picks:[...x.picks,i],correct:x.correct||right}))}
  function setNote(v){setRev(x=>({...x,note:v}))}
  function useHint(n){setRev(x=>({...x,hints:Math.max(x.hints||0,n)}))}
  function pickDonor(i){if(r1&&rev.donor!=null&&rev.donor!==i){setEq(e=>({...e,[TRADES[rev.donor].k]:JSON.parse(JSON.stringify(r1.eq[TRADES[rev.donor].k]))}));const k=TRADES[rev.donor].k,j=rev.donor;setG(x=>({...x,[k]:r1.D[j]}));setLocked(x=>({...x,[k]:true}))}
    setRev(x=>({...x,donor:i,donorPicks:[...(x.donorPicks||[]),i]}))}
  function keepR1(snap){   // Round 2 starts from Round 1: same durations locked, same start dates plotted
    const gg={},ll={};TRADES.forEach((t,i)=>{gg[t.k]=snap.D[i];ll[t.k]=true});
    setG(gg);setLocked(ll);setStarts({...snap.starts});setPlotK(6);setMsg(null);setMisses(0);setHover(null);setPlaying(false);
  }
  function startRound2(){
    const snap=roundStats(eq,starts);setR1(snap);setRound(2);keepR1(snap);missTotal.current=0;roundT0.current=Date.now();
    setRev({picks:[],correct:false,note:'',donor:null,donorPicks:[],hints:0});setActiveEq(TRADES[snap.slow[0]].k);setCam('overview');setTab('review');
  }
  function resetFleet(){if(!r1)return;setEq(JSON.parse(JSON.stringify(r1.eq)));keepR1(r1)}
  function resetPlot(){
    if(round===2&&r1){setStarts({...r1.starts});setPlotK(6);setMsg(null);setMisses(0);setHover(null);setPlaying(false);return}setStarts({exc:0,pipe:null,back:null});setPlotK(1);setMsg(null);setMisses(0);setHover(null);setPlaying(false)}
  function setCount(k,id,d){
    setEq(e=>{const cur=(e[k][id]||0)+d;return {...e,[k]:{...e[k],[id]:Math.max(0,cur)}}});
    if(round!==2){setG(x=>({...x,[k]:0}));setLocked(x=>({...x,[k]:false}))}resetPlot();
  }
  useEffect(()=>{if(round!==2)return;const gg={},ll={};TRADES.forEach((t,i)=>{gg[t.k]=D[i];ll[t.k]=true});setG(gg);setLocked(ll)},[round,JSON.stringify(eq)]);
  function setGuess(k,v){setG(x=>({...x,[k]:v}))}
  function lockDur(k){setLocked(x=>({...x,[k]:true}))}
  function unlockDur(k){setLocked(x=>({...x,[k]:false}));setG(x=>({...x,[k]:0}));resetPlot()}

  /* chart pointer helpers */
  function viewPt(ev){
    const svg=svgRef.current,pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
    const m=svg.getScreenCTM();return m?pt.matrixTransform(m.inverse()):{x:0,y:0};
  }
  const dayAt=x=>(x-ML)/PW*DOM;
  const ys=f=>MT+PH-f/PJ*PH;
  function miss(text,lvl){setMsg({lvl:lvl||'bad',text});setMisses(m=>m+1);missTotal.current++}
  function accept(next){setPlotK(next);setMsg(null);setMisses(0);setHover(null)}
  function plotClick(ev){
    if(plotK>=6)return;
    const v=viewPt(ev),ti=Math.floor(plotK/2),t=TRADES[ti],isStart=plotK%2===0;
    if(v.x<ML-6||v.x>ML+PW+6)return;
    const d=Math.round(dayAt(v.x)),row=ys(isStart?0:PJ);
    if(!isStart&&Math.abs(v.y-row)>28){miss(`Click the ring on the 3 mi row.`,'warn');return}
    if(isStart){
      if(d<0||d>DOM-D[ti]){miss(`Start ${t.name.toLowerCase()} between day 0 and day ${DOM-D[ti]}.`,'warn');return}
      if(ti>0){const p=TRADES[ti-1],eP=starts[p.k]+D[ti-1];
        if(Math.abs(d-eP)>2){miss(`${t.name} starts the same day ${p.name.toLowerCase()} finishes: day ${eP}. Click on the dashed line.`,'warn');return}
        setStarts(x=>({...x,[t.k]:eP}));accept(plotK+1);return;}
      setStarts(x=>({...x,[t.k]:d}));
      accept(plotK+1,`${t.name} starts at day ${d}.`);
    }else{
      const want=starts[t.k]+D[ti],diff=d-want;
      if(Math.abs(diff)<=4)finishCrew(ti);
      else miss(`Click the ring at day ${want}.`,'warn');
    }
  }
  function finishCrew(ti){const nx=TRADES[ti+1];if(nx)setStarts(x=>({...x,[nx.k]:starts[TRADES[ti].k]+D[ti]}));accept(ti<2?plotK+2:6)}
  function snapEnd(){if(plotK<6&&plotK%2===1)finishCrew(Math.floor(plotK/2))}
  function undoStart(){if(plotK%2!==1)return;const k=TRADES[Math.floor(plotK/2)].k;setStarts(x=>({...x,[k]:null}));setPlotK(plotK-1);setMsg(null);setMisses(0)}
  function startDrag(i,ev){
    ev.stopPropagation();
    try{svgRef.current.setPointerCapture(ev.pointerId)}catch(e){}
    const v=viewPt(ev);setDragI({i,off:dayAt(v.x)-starts[TRADES[i].k]});
  }
  const h={
    down:ev=>{if(plotK<6)plotClick(ev)},
    move:ev=>{
      const v=viewPt(ev);
      if(dragI){
        const i=dragI.i,k=TRADES[i].k,lo=i>0?starts[TRADES[i-1].k]+D[i-1]:0;
        let sNew=Math.max(lo,clamp(Math.round(dayAt(v.x)-dragI.off),0,DOM-D[i]));
        if(i>0&&Math.abs(sNew-lo)<=2)sNew=lo;
        if(sNew!==starts[k])setStarts(x=>({...x,[k]:sNew}));
      }else if(plotK<6){
        const d=Math.round(dayAt(v.x));setHover(d>=0&&d<=DOM?d:null);
      }
    },
    up:ev=>{if(dragI){try{svgRef.current.releasePointerCapture(ev.pointerId)}catch(e){}setDragI(null)}},
    leave:()=>{if(!dragI)setHover(null)},
    startDrag
  };

  /* what the 3D view shows */
  const idxActive=TRADES.findIndex(t=>!locked[t.k]);
  let view;
  if(tab==='lob'||tab==='cmp'||tab==='review'||tab==='r1view')view={mode:'sim',starts:ctx.starts,durs:ctx.D,cam};
  else if(tab==='equip'){
    /* the selected crew: machines appear as they are added, then work along the 3 miles as the days slider moves */
    const i=TRADES.findIndex(t=>t.k===activeEq),k=activeEq,gk=g[k],raw=gk*R[i],full=locked[k]&&gk===D[i];
    const ft=full?PJ:Math.min(raw,PJ);
    view={mode:'static',cam:activeEq,crews:TRADES.map((t,j)=>({ft:j<i?PJ:j===i?ft:0,vis:j===i,anim:j===i&&U[j]>0&&ft<PJ,
      tag:j===i?(!U[j]?'No machines yet':full?`Full at ${plural(D[j],'day')}`:raw>=PJ?'Past 15,840 ft':gk>0?`Day ${gk}: ${fmt(ft)} ft`:`${plural(U[j],'machine')} · ${fmt(R[j])} ft/day`):''}))};
  }else if(false){
    if(idxActive<0)view={mode:'static',cam:'overview',crews:TRADES.map((t,j)=>({ft:PJ,vis:true,anim:false,tag:plural(D[j],'day')}))};
    else{
      const a=idxActive,gk=g[TRADES[a].k],raw=gk*R[a],ft=Math.min(raw,PJ);
      view={mode:'static',cam:TRADES[a].k,crews:TRADES.map((t,j)=>({ft:j<a?PJ:j===a?ft:0,vis:j===a,anim:j===a&&ft>0&&ft<PJ,
        tag:j===a?(raw>=PJ?(gk===D[a]?`Full at ${plural(D[a],'day')}`:'Past 15,840 ft'):`Day ${gk}: ${fmt(ft)} ft`):''}))};
    }
  }else view={mode:'static',cam:'overview',crews:TRADES.map(()=>({ft:0,vis:false,anim:false,tag:''}))};

  const state={note,player,setPlayer,logStat,submitReflection,cmpDirty:cmpSentSig.current!==refl.plus+'|'+refl.delta,
    site,siteName:SITES[site].name,opt,projT,projC,gatePass,useHint,tab,setTab,eq,activeEq,setActiveEq,setCount,g,setGuess,locked,lockDur,unlockDur,R,U,D,fleetOk,DOM,
    starts,plotK,msg,misses,chk,snapEnd,undoStart,resetPlot,hover,svgRef,h,dragI:dragI?dragI.i:null,
    simDay,endDay,playing,speed,setSpeed,cam,setCam,togglePlay,restart,scrub,seek,
    revise,ready,bIdx,snapStart,canRedo:i=>round===1||(r1&&(r1.slow.includes(i)||rev.donor===i)),lastR2Tab,doneR2:doneR[2],
    round,r1,rev,pickBottleneck,pickDonor,overCap,setNote,startRound2,resetFleet,changedR2,prevRef,refl,setRefl,cmpRef};
  const npc=npcLine({tab,round,site,eq,activeEq,g,D,R,U,locked,plotK,starts,chk,ready,simDay,endDay,playing,r1,rev,opt,revise,overCap,changedR2,projT,projC,gatePass,doneR,
    cmpScore:tab==='cmp'&&r1&&opt?{T:roundStats(eq,starts).project,C:roundStats(eq,starts).direct}:null});
  const simState={...state,note,eq:ctx.eq,starts:ctx.starts,D:ctx.D,cmpR:tab==='cmp'?cmpR:null,setCmpR};

  const tabs=round===1?[
    {id:'intro',label:'Intro',n:'i',ok:true,done:false},
    {id:'equip',label:'Crews',n:1,ok:true,done:fleetOk&&durDone},
    {id:'lob',label:'Schedule',n:2,ok:fleetOk&&durDone,done:doneR[1]}
  ]:[
    {id:'intro',label:'Intro',n:'i',ok:true,done:false},
    {id:'review',label:'Review',n:1,ok:true,done:rev.correct},
    {id:'equip',label:'Reallocate',n:2,ok:rev.correct&&rev.donor!=null,done:gatePass},
    {id:'lob',label:'Schedule',n:3,ok:rev.correct&&gatePass,done:doneR[2]},
    {id:'cmp',label:'Compare',n:4,ok:doneR[2]&&ready,done:false}
  ];

  return(
  <div className={'app'+(tab==='lob'||tab==='cmp'||tab==='r1view'?' wide':'')}>
    <div className="left">
      <div className="brand">
        <div className="brand-title">Line of Balance: Pipeline</div>
        <div className="brand-sub">College Station Water Pipeline · {SITES[site].name}</div>
        <div className="rounds" role="tablist" aria-label="Rounds">
          {(()=>{
            const viewing=round===2&&tab==='r1view'?1:round;
            const d1=r1?r1.project:(plotK===6?Math.max(...TRADES.map((t,i)=>starts[t.k]+D[i]))-Math.min(...TRADES.map(t=>starts[t.k])):null);
            const d2=round===2&&plotK===6?Math.max(...TRADES.map((t,i)=>starts[t.k]+D[i]))-Math.min(...TRADES.map(t=>starts[t.k])):null;
            const items=[{n:1,d:d1,ok:round===2,go:()=>setTab('r1view')},{n:2,d:d2,ok:round===2,go:()=>setTab(lastR2Tab==='r1view'?'review':lastR2Tab)}];
            return(<>
              {items.map(x=><button key={x.n} role="tab" aria-selected={viewing===x.n} className={'rnd'+(viewing===x.n?' on':'')+(x.n<round?' past':'')}
                disabled={!x.ok||viewing===x.n} onClick={x.go}>
                Round {x.n}{x.d!=null&&<span className="rnd-d">{x.d} d</span>}
              </button>)}
              {d1!=null&&d2!=null&&<span className={'rnd-diff '+(d2<d1?'good':d2>d1?'bad':'')}>{d2===d1?'same duration':`${d2<d1?'▼':'▲'} ${Math.abs(d2-d1)} d`}</span>}
            </>)})()}
        </div>
      </div>
      <div className={'tabs'+(tab==='r1view'?' dim':'')} role="tablist">
        {tabs.map(x=>(
          <button key={x.id} role="tab" aria-selected={tab===x.id} disabled={!x.ok} className={'tab'+(tab===x.id?' on':'')+(x.done?' done':'')} onClick={()=>setTab(x.id)}>
            <span className="dot">{x.done?'✓':x.n}</span>{x.label}
          </button>))}
      </div>
      {LOG_URL&&<div className="logbar">Results save to the study sheet{logStat[1]==='sent'?' · Round 1 ✓':''}{logStat[2]==='sent'?' · Round 2 ✓':''}{logStat.cmp==='sent'?' · Reflection ✓':''}</div>}
      <div className="scroll">
        {tab==='intro'&&<IntroTab s={state}/>}
        {tab==='equip'&&<EquipTab s={state}/>}
        {tab==='lob'&&<ScheduleTab s={state}/>}
        {tab==='review'&&<ReviewTab s={state}/>}
        {tab==='cmp'&&<CompareTab s={state}/>}
        {tab==='r1view'&&r1&&<R1View s={state}/>}
      </div>
    </div>
    <div className="right">
      <Sim3D eq={ctx.eq} view={view} dayRef={simRef}>{((tab==='lob'&&ready)||tab==='cmp'||((tab==='review'||tab==='r1view')&&r1))&&<SimHud s={simState}/>}<Npc line={npc}/></Sim3D>
      {tab==='lob'&&(ready?<SimBar s={simState}/>:<p className="caption">{round===2?'Crews wait at the staging area until every start date after the changed crew is revised.':'Crews wait at the staging area until every crew starts the day the one ahead finishes.'}</p>)}
      {(tab==='cmp'||((tab==='review'||tab==='r1view')&&r1))&&<SimBar s={simState}/>}
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
